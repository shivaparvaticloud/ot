# Cloudflare Pages project configuration.
#
# There is no build step — `public/` is the site, served as-is. Everything
# outside it (this file, README.md, .gitignore) is not part of the output
# and is never served.
#
# Pages treats this file as the source of truth, so the build settings in
# the dashboard are locked to what is set here. In particular the build
# output directory is pinned to public/ and cannot be set to / by mistake.
#
# public/_headers is read as configuration, not served as an asset, and
# public/404.html is picked up automatically as the not-found page.
#
# Note: this is the Pages schema. `wrangler deploy` (the Workers command)
# does not read pages_build_output_dir — use `wrangler pages deploy`.

name = "ot-site"
pages_build_output_dir = "./public"
compatibility_date = "2026-08-09"
