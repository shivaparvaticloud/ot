# Cloudflare Workers static-assets configuration.
#
# There is no build step and no Worker script — `public/` is the site,
# uploaded and served as-is by `wrangler deploy`.
#
# not_found_handling is required: unlike Pages, Workers does not infer
# anything from the presence of 404.html. Without it the default is
# "none" and public/404.html would never be served.
#
# public/_headers is read as configuration, not served as an asset.

name = "ot"
compatibility_date = "2026-08-09"

[assets]
directory = "./public"
not_found_handling = "404-page"
