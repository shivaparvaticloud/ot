<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Three overlapping circles">
  <!-- Single mid-tone treatment, matching the site's permanent dark theme.
       These values stay legible against both light and dark browser chrome,
       so the icon needs no prefers-color-scheme switch. -->
  <style>
    .ring { fill: none; stroke: #8FAEC0; stroke-width: 1.7; }
    .fill { fill: #8FAEC0; opacity: 0.18; }
    .core { fill: #D49AA0; opacity: 0.36; }
  </style>
  <circle class="fill" cx="16" cy="11.5" r="8.6"/>
  <circle class="fill" cx="10.6" cy="20.5" r="8.6"/>
  <circle class="fill" cx="21.4" cy="20.5" r="8.6"/>
  <circle class="core" cx="16" cy="17.6" r="3.9"/>
  <circle class="ring" cx="16" cy="11.5" r="8.6"/>
  <circle class="ring" cx="10.6" cy="20.5" r="8.6"/>
  <circle class="ring" cx="21.4" cy="20.5" r="8.6"/>
</svg>
